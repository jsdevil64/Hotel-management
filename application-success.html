<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Application Success - HotelJobs</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen p-2 sm:p-4">
  <div class="w-full max-w-sm bg-white rounded-3xl shadow-xl p-6 text-center space-y-6">
    
    <div class="pt-6 flex justify-center">
      <div class="w-20 h-20 bg-emerald-500 text-white rounded-full flex items-center justify-center text-4xl shadow-lg shadow-emerald-200">
        ✓
      </div>
    </div>

    <div>
      <h2 class="text-lg font-bold text-gray-800">Application Submitted!</h2>
      <p class="text-xs text-gray-500 mt-1">You have successfully applied for</p>
      <p class="text-xs font-bold text-indigo-900 mt-1">Front Office Associate</p>
      <p class="text-xs text-gray-600">Taj Hotel, Chennai</p>
    </div>

    <div class="bg-gray-50 p-4 rounded-2xl border text-xs space-y-2 text-left">
      <div class="flex justify-between">
        <span class="text-gray-500 text-[11px]">Application ID</span>
        <span class="font-bold text-gray-800">HJ12345678</span>
      </div>
      <div class="flex justify-between">
        <span class="text-gray-500 text-[11px]">Applied On</span>
        <span class="font-medium text-gray-800">15 May 2025, 10:30 AM</span>
      </div>
      <div class="flex justify-between">
        <span class="text-gray-500 text-[11px]">Status</span>
        <span class="bg-blue-100 text-blue-700 font-bold px-2 py-0.5 rounded-full text-[10px]">Applied</span>
      </div>
    </div>

    <div class="space-y-3 pt-2">
      <a href="my-applications.html" class="block w-full py-3 bg-indigo-900 hover:bg-indigo-950 text-white text-xs font-bold rounded-xl">
        View My Applications
      </a>
      <a href="find-jobs.html" class="block w-full py-3 border border-indigo-900 text-indigo-900 text-xs font-bold rounded-xl">
        Browse More Jobs
      </a>
    </div>

  </div>
</body>
</html>
