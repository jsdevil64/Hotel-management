<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post a New Job - HotelJobs</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen p-2 sm:p-4">
  <div class="w-full max-w-3xl bg-white rounded-3xl shadow-xl overflow-hidden flex flex-col justify-between min-h-[600px]">
    
    <div>
      <div class="bg-indigo-950 text-white p-4 flex justify-between items-center">
        <a href="hotel-dashboard.html" class="text-lg">&larr;</a>
        <h2 class="font-bold text-sm">Post a New Job</h2>
        <div></div>
      </div>

      <div class="p-6 grid grid-cols-3 gap-6">
        <form class="col-span-2 space-y-3 text-xs">
          <div>
            <label class="font-semibold text-gray-700 block mb-1">Job Title *</label>
            <input type="text" placeholder="Enter job title" class="w-full border rounded-xl p-2 outline-none focus:ring-1 focus:ring-indigo-600">
          </div>

          <div>
            <label class="font-semibold text-gray-700 block mb-1">Department *</label>
            <select class="w-full border rounded-xl p-2 outline-none focus:ring-1 focus:ring-indigo-600 bg-white">
              <option value="">Select department</option>
              <option>Front Office</option>
              <option>Housekeeping</option>
              <option>Food & Beverage (F&B)</option>
              <option>Kitchen / Culinary</option>
            </select>
          </div>

          <div>
            <label class="font-semibold text-gray-700 block mb-1">Job Type *</label>
            <div class="flex space-x-3 text-[11px] pt-1">
              <label class="flex items-center space-x-1 cursor-pointer">
                <input type="radio" name="jobtype" checked class="accent-indigo-900">
                <span>Full Time</span>
              </label>
              <label class="flex items-center space-x-1 cursor-pointer">
                <input type="radio" name="jobtype" class="accent-indigo-900">
                <span>Part Time</span>
              </label>
              <label class="flex items-center space-x-1 cursor-pointer">
                <input type="radio" name="jobtype" class="accent-indigo-900">
                <span>Internship</span>
              </label>
              <label class="flex items-center space-x-1 cursor-pointer">
                <input type="radio" name="jobtype" class="accent-indigo-900">
                <span>Contract</span>
              </label>
            </div>
          </div>

          <div>
            <label class="font-semibold text-gray-700 block mb-1">Experience Level *</label>
            <select class="w-full border rounded-xl p-2 outline-none focus:ring-1 focus:ring-indigo-600 bg-white">
              <option value="">Select experience</option>
              <option>Fresher (0 Years)</option>
              <option>0 - 2 Years</option>
              <option>2 - 5 Years</option>
            </select>
          </div>

          <div>
            <label class="font-semibold text-gray-700 block mb-1">Salary Range *</label>
            <div class="flex items-center space-x-2">
              <input type="text" placeholder="Min Salary" class="w-full border rounded-xl p-2 outline-none focus:ring-1 focus:ring-indigo-600">
              <span class="text-gray-400">to</span>
              <input type="text" placeholder="Max Salary" class="w-full border rounded-xl p-2 outline-none focus:ring-1 focus:ring-indigo-600">
            </div>
          </div>

          <div>
            <label class="font-semibold text-gray-700 block mb-1">Job Description *</label>
            <textarea rows="3" placeholder="Write job description..." class="w-full border rounded-xl p-2 outline-none focus:ring-1 focus:ring-indigo-600"></textarea>
          </div>

          <div>
            <label class="font-semibold text-gray-700 block mb-1">Requirements</label>
            <textarea rows="2" placeholder="Enter key skills, qualifications, etc." class="w-full border rounded-xl p-2 outline-none focus:ring-1 focus:ring-indigo-600"></textarea>
          </div>

          <div>
            <label class="font-semibold text-gray-700 block mb-1">Application Deadline</label>
            <input type="date" class="w-full border rounded-xl p-2 outline-none focus:ring-1 focus:ring-indigo-600 text-gray-500">
          </div>
        </form>

        <div class="bg-gray-50 border rounded-2xl p-4 flex flex-col items-center justify-center text-center space-y-2">
          <p class="text-[10px] font-bold text-gray-400 uppercase">Preview</p>
          <div class="w-12 h-12 bg-indigo-100 text-indigo-900 rounded-xl flex items-center justify-center text-xl font-bold">
            💼
          </div>
          <h4 class="text-xs font-bold text-gray-800">Job Title</h4>
          <p class="text-[10px] text-gray-500">Department</p>
          <p class="text-[10px] text-gray-400">Job Type • Experience</p>
          <p class="text-[10px] font-bold text-amber-600">Salary Range</p>
          <p class="text-[9px] text-gray-400 leading-tight">Short job description will appear here...</p>
        </div>
      </div>

      <div class="p-4 bg-gray-50 border-t flex justify-end space-x-3">
        <button class="px-6 py-2 border rounded-xl text-xs font-bold text-gray-600 hover:bg-gray-100">Cancel</button>
        <button class="px-6 py-2 bg-indigo-900 hover:bg-indigo-950 text-white rounded-xl text-xs font-bold">Publish Job</button>
      </div>
    </div>

  </div>
  <script type="module" src="post-job.js"></script>

</body>
</html>
