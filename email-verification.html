<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Your Email - HotelJobs</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen p-4">
  <div class="w-full max-w-sm bg-white rounded-3xl shadow-xl p-6 text-center space-y-5">
    
    <div class="pt-4 flex justify-center">
      <div class="w-20 h-20 bg-purple-100 rounded-full flex items-center justify-center text-4xl text-purple-600 relative">
        ✉️
        <span class="absolute top-1 right-1 bg-green-500 text-white rounded-full text-xs p-1">✓</span>
      </div>
    </div>

    <div>
      <h2 class="text-xl font-bold text-gray-800">Verify Your Email</h2>
      <p class="text-xs text-gray-500 mt-1">We have sent a verification link to</p>
      <p class="text-xs font-bold text-purple-700">example@email.com</p>
    </div>

    <div class="bg-gray-50 p-4 rounded-xl text-left text-xs space-y-2 border text-gray-600">
      <div class="flex items-start space-x-2">
        <span>📩</span>
        <p>Check your inbox for the verification email.</p>
      </div>
      <div class="flex items-start space-x-2">
        <span>🔗</span>
        <p>Click on the link in the email to verify your account.</p>
      </div>
      <div class="flex items-start space-x-2">
        <span>⏰</span>
        <p>The link will expire in 24 hours.</p>
      </div>
    </div>

    <div class="space-y-3 pt-2">
      <a href="#" class="block w-full py-3 bg-purple-600 hover:bg-purple-700 text-white text-xs font-semibold rounded-xl">Go to Email</a>
      <button class="text-xs text-purple-600 font-semibold hover:underline">Resend Email (00:45)</button>
    </div>

  </div>
</body>
</html>
