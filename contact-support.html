<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Support - HotelJobs</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen p-2 sm:p-4">
  <div class="w-full max-w-2xl bg-white rounded-3xl shadow-xl overflow-hidden flex flex-col justify-between min-h-[600px]">
    
    <div>
      <div class="bg-indigo-950 text-white p-4 flex justify-between items-center">
        <a href="student-settings.html" class="text-lg">&larr;</a>
        <h2 class="font-bold text-sm">Contact Support</h2>
        <div></div>
      </div>

      <div class="p-6 grid grid-cols-2 gap-6">
        <div class="space-y-4">
          <div>
            <h3 class="text-sm font-bold text-gray-800">We're Here to Help!</h3>
            <p class="text-[10px] text-gray-500">Have a question or need assistance? Our support team is here for you.</p>
          </div>

          <div class="space-y-3 text-xs">
            <div class="flex items-center space-x-3 p-3 bg-gray-50 rounded-2xl border">
              <span class="text-indigo-900 text-base">✉️</span>
              <div>
                <p class="text-[9px] text-gray-400 font-medium">Email</p>
                <p class="font-bold text-indigo-900 text-[11px]">support@hoteljobs.com</p>
              </div>
            </div>

            <div class="flex items-center space-x-3 p-3 bg-gray-50 rounded-2xl border">
              <span class="text-indigo-900 text-base">📞</span>
              <div>
                <p class="text-[9px] text-gray-400 font-medium">Phone</p>
                <p class="font-bold text-gray-800 text-[11px]">+91 98765 43210</p>
              </div>
            </div>

            <div class="flex items-center space-x-3 p-3 bg-emerald-50 rounded-2xl border border-emerald-100">
              <span class="text-emerald-600 text-base">💬</span>
              <div>
                <p class="text-[9px] text-emerald-600 font-medium">WhatsApp</p>
                <p class="font-bold text-emerald-800 text-[11px]">+91 98765 43210</p>
              </div>
            </div>

            <div class="flex items-center space-x-3 p-3 bg-gray-50 rounded-2xl border">
              <span class="text-indigo-900 text-base">🕒</span>
              <div>
                <p class="text-[9px] text-gray-400 font-medium">Support Hours</p>
                <p class="font-bold text-gray-800 text-[11px]">Mon - Sat: 9:00 AM - 7:00 PM</p>
              </div>
            </div>
          </div>
        </div>

        <div class="space-y-3">
          <h3 class="text-xs font-bold text-gray-800">Send us a Message</h3>

          <form class="space-y-2.5 text-xs">
            <div>
              <label class="font-semibold text-gray-700 block mb-1">Your Name</label>
              <input type="text" placeholder="Enter your name" class="w-full border rounded-xl p-2 outline-none focus:ring-1 focus:ring-indigo-600">
            </div>

            <div>
              <label class="font-semibold text-gray-700 block mb-1">Email Address</label>
              <input type="email" placeholder="Enter your email" class="w-full border rounded-xl p-2 outline-none focus:ring-1 focus:ring-indigo-600">
            </div>

            <div>
              <label class="font-semibold text-gray-700 block mb-1">Subject</label>
              <select class="w-full border rounded-xl p-2 outline-none focus:ring-1 focus:ring-indigo-600 bg-white">
                <option value="">Select a subject</option>
                <option>Account Support</option>
                <option>Job Application Issue</option>
                <option>Hotel Profile Query</option>
                <option>Other</option>
              </select>
            </div>

            <div>
              <label class="font-semibold text-gray-700 block mb-1">Message</label>
              <textarea rows="3" placeholder="Type your message..." class="w-full border rounded-xl p-2 outline-none focus:ring-1 focus:ring-indigo-600"></textarea>
            </div>

            <button type="submit" class="w-full py-2.5 bg-indigo-900 hover:bg-indigo-950 text-white font-bold rounded-xl text-xs">
              Send Message
            </button>
          </form>
        </div>
      </div>
    </div>

  </div>
</body>
</html>
