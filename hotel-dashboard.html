<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Dashboard - HotelJobs</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen">

  <header class="bg-indigo-900 text-white p-4 shadow-md flex justify-between items-center px-6">
    <h1 class="text-xl font-bold">Hotel Management</h1>
    <button id="logoutBtn" class="bg-red-500 hover:bg-red-600 px-3 py-1.5 rounded-lg text-xs font-bold transition">Logout</button>
  </header>

  <main class="max-w-4xl mx-auto mt-6 p-4">
    <div class="bg-white rounded-2xl p-6 shadow-md mb-6 border border-slate-200 flex items-center space-x-4">
      <div class="w-16 h-16 rounded-2xl bg-indigo-50 flex items-center justify-center overflow-hidden border border-indigo-200">
        <img id="hotelLogoDisplay" src="https://via.placeholder.com/150" alt="Hotel Logo" class="w-full h-full object-cover">
      </div>
      <div>
        <h2 id="hotelNameDisplay" class="text-xl font-bold text-slate-800">Loading...</h2>
        <p id="ownerNameDisplay" class="text-xs text-slate-500">Owner / Manager Name</p>
        <p id="locationDisplay" class="text-xs text-indigo-700 font-semibold mt-1">Location</p>
      </div>
    </div>
  </main>

  <script type="module">
    import { auth, db, doc, getDoc } from './firebase-config.js';
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        const docRef = doc(db, "hotels", user.uid);
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
          const data = docSnap.data();
          document.getElementById('hotelNameDisplay').innerText = data.hotelName || "Hotel Name";
          document.getElementById('ownerNameDisplay').innerText = `Owner: ${data.ownerName || ''}`;
          document.getElementById('locationDisplay').innerText = `📍 ${data.location || ''}`;
          if (data.hotelLogo) {
            document.getElementById('hotelLogoDisplay').src = data.hotelLogo;
          }
        }
      } else {
        window.location.href = "hotel-login.html";
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
      signOut(auth).then(() => { window.location.href = "hotel-login.html"; });
    });
  </script>
</body>
</html>
