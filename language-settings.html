<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Language Settings - HotelJobs</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen p-2 sm:p-4">
  <div class="w-full max-w-sm bg-white rounded-3xl shadow-xl overflow-hidden flex flex-col justify-between min-h-[680px]">
    
    <div>
      <div class="bg-indigo-950 text-white p-4 flex justify-between items-center">
        <a href="student-settings.html" class="text-lg">&larr;</a>
        <h2 class="font-bold text-sm">Language Settings</h2>
        <div></div>
      </div>

      <div class="p-4 space-y-4">
        <p class="text-xs font-semibold text-gray-700">Select Your Language</p>

        <div class="space-y-2 text-xs">
          <label class="flex justify-between items-center p-3 bg-gray-50 rounded-2xl border cursor-pointer hover:bg-indigo-50/50">
            <div>
              <p class="font-bold text-gray-800">English</p>
              <p class="text-[10px] text-gray-400">English</p>
            </div>
            <input type="radio" name="lang" checked class="w-4 h-4 accent-indigo-900">
          </label>

          <label class="flex justify-between items-center p-3 bg-gray-50 rounded-2xl border cursor-pointer hover:bg-indigo-50/50">
            <div>
              <p class="font-bold text-gray-800">தமிழ்</p>
              <p class="text-[10px] text-gray-400">Tamil</p>
            </div>
            <input type="radio" name="lang" class="w-4 h-4 accent-indigo-900">
          </label>

          <label class="flex justify-between items-center p-3 bg-gray-50 rounded-2xl border cursor-pointer hover:bg-indigo-50/50">
            <div>
              <p class="font-bold text-gray-800">हिंदी</p>
              <p class="text-[10px] text-gray-400">Hindi</p>
            </div>
            <input type="radio" name="lang" class="w-4 h-4 accent-indigo-900">
          </label>

          <label class="flex justify-between items-center p-3 bg-gray-50 rounded-2xl border cursor-pointer hover:bg-indigo-50/50">
            <div>
              <p class="font-bold text-gray-800">తెలుగు</p>
              <p class="text-[10px] text-gray-400">Telugu</p>
            </div>
            <input type="radio" name="lang" class="w-4 h-4 accent-indigo-900">
          </label>

          <label class="flex justify-between items-center p-3 bg-gray-50 rounded-2xl border cursor-pointer hover:bg-indigo-50/50">
            <div>
              <p class="font-bold text-gray-800">മലയാളം</p>
              <p class="text-[10px] text-gray-400">Malayalam</p>
            </div>
            <input type="radio" name="lang" class="w-4 h-4 accent-indigo-900">
          </label>

          <label class="flex justify-between items-center p-3 bg-gray-50 rounded-2xl border cursor-pointer hover:bg-indigo-50/50">
            <div>
              <p class="font-bold text-gray-800">ಕನ್ನಡ</p>
              <p class="text-[10px] text-gray-400">Kannada</p>
            </div>
            <input type="radio" name="lang" class="w-4 h-4 accent-indigo-900">
          </label>
        </div>

        <button type="button" class="w-full py-3 bg-indigo-900 hover:bg-indigo-950 text-white font-bold rounded-xl text-xs mt-4">
          Save Language
        </button>
      </div>
    </div>

  </div>
</body>
</html>
