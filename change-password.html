<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Password - HotelJobs</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen p-2 sm:p-4">
  <div class="w-full max-w-sm bg-white rounded-3xl shadow-xl overflow-hidden flex flex-col justify-between min-h-[680px]">
    
    <div>
      <div class="bg-indigo-950 text-white p-4 flex justify-between items-center">
        <a href="student-settings.html" class="text-lg">&larr;</a>
        <h2 class="font-bold text-sm">Change Password</h2>
        <div></div>
      </div>

      <div class="p-4 space-y-4">
        <form class="space-y-3 text-xs">
          <div>
            <label class="font-semibold text-gray-700 block mb-1">Current Password</label>
            <input type="password" placeholder="Enter current password" class="w-full border rounded-xl p-2.5 outline-none focus:ring-1 focus:ring-indigo-600">
          </div>

          <div>
            <label class="font-semibold text-gray-700 block mb-1">New Password</label>
            <input type="password" placeholder="Enter new password" class="w-full border rounded-xl p-2.5 outline-none focus:ring-1 focus:ring-indigo-600">
            <p class="text-[9px] text-gray-400 mt-1">Minimum 8 characters with letters and numbers</p>
          </div>

          <div>
            <label class="font-semibold text-gray-700 block mb-1">Confirm New Password</label>
            <input type="password" placeholder="Confirm new password" class="w-full border rounded-xl p-2.5 outline-none focus:ring-1 focus:ring-indigo-600">
          </div>

          <button type="submit" class="w-full py-3 bg-indigo-900 hover:bg-indigo-950 text-white font-bold rounded-xl mt-2">
            Update Password
          </button>
        </form>

        <div class="bg-indigo-50 p-4 rounded-2xl border border-indigo-100 space-y-2">
          <h4 class="text-xs font-bold text-indigo-900 flex items-center space-x-1">
            <span>🛡️</span><span>Password Tips</span>
          </h4>
          <ul class="text-[10px] text-indigo-800 space-y-1 list-disc list-inside">
            <li>Use a strong password</li>
            <li>Don't share your password with others</li>
            <li>Change your password regularly</li>
          </ul>
        </div>
      </div>
    </div>

  </div>
</body>
</html>
