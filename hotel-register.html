<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Register - HotelJobs</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen p-4">
  <div class="w-full max-w-sm bg-white rounded-3xl shadow-xl p-6 space-y-4">
    
    <div class="flex items-center justify-between">
      <a href="hotel-login.html" class="text-gray-600 text-xl">&larr;</a>
      <div class="flex items-center space-x-1">
        <span class="text-amber-500">🏨</span>
        <span class="font-bold text-lg text-purple-900">Hotel<span class="text-amber-500">Jobs</span></span>
      </div>
      <div></div>
    </div>

    <div class="text-center">
      <h2 class="text-xl font-bold text-gray-800">Hotel Register</h2>
      <p class="text-xs text-gray-500">Create your hotel account</p>
    </div>

    <form action="email-verification.html" class="space-y-3">
      <div>
        <label class="text-xs font-semibold text-gray-700 block mb-1">Hotel Name</label>
        <input type="text" placeholder="Enter hotel name" class="w-full border rounded-xl p-2 text-xs focus:ring-2 focus:ring-amber-500 outline-none">
      </div>
      <div>
        <label class="text-xs font-semibold text-gray-700 block mb-1">Email Address</label>
        <input type="email" placeholder="Enter your email" class="w-full border rounded-xl p-2 text-xs focus:ring-2 focus:ring-amber-500 outline-none">
      </div>
      <div>
        <label class="text-xs font-semibold text-gray-700 block mb-1">Phone Number</label>
        <input type="tel" placeholder="Enter your phone number" class="w-full border rounded-xl p-2 text-xs focus:ring-2 focus:ring-amber-500 outline-none">
      </div>
      <div>
        <label class="text-xs font-semibold text-gray-700 block mb-1">Password</label>
        <input type="password" placeholder="Create a password" class="w-full border rounded-xl p-2 text-xs focus:ring-2 focus:ring-amber-500 outline-none">
      </div>
      <div>
        <label class="text-xs font-semibold text-gray-700 block mb-1">Confirm Password</label>
        <input type="password" placeholder="Confirm your password" class="w-full border rounded-xl p-2 text-xs focus:ring-2 focus:ring-amber-500 outline-none">
      </div>

      <div class="flex items-center space-x-2 pt-1">
        <input type="checkbox" id="terms" class="rounded accent-amber-500">
        <label for="terms" class="text-[10px] text-gray-600">I agree to the <a href="#" class="text-amber-500 font-semibold">Terms & Conditions</a></label>
      </div>

      <button type="submit" class="w-full py-3 bg-amber-500 hover:bg-amber-600 text-white text-xs font-semibold rounded-xl">Create Account</button>
    </form>

    <p class="text-center text-xs text-gray-500 pt-2">
      Already have an account? <a href="hotel-login.html" class="text-amber-500 font-semibold hover:underline">Login</a>
    </p>

  </div>
  <script type="module" src="hotel-register.js"></script>

</body>
</html>
