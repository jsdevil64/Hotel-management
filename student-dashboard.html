<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Dashboard - HotelJobs</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen pb-10">

  <header class="bg-indigo-900 text-white p-4 shadow-md flex justify-between items-center px-6 sticky top-0 z-50">
    <div class="flex items-center space-x-2">
      <span class="text-xl">🎓</span>
      <h1 class="text-lg font-bold tracking-wide">HotelJobs</h1>
    </div>
    <div class="flex items-center space-x-4">
      <span id="welcomeText" class="text-xs md:text-sm font-medium text-indigo-200">Welcome, Student!</span>
      <button id="logoutBtn" class="bg-red-500 hover:bg-red-600 px-3 py-1.5 rounded-xl text-xs font-bold transition shadow">
        Logout
      </button>
    </div>
  </header>

  <main class="max-w-3xl mx-auto mt-6 px-4">
    
    <div class="bg-white rounded-3xl p-6 shadow-md mb-6 border border-slate-200 flex items-center space-x-5">
      <div class="relative w-20 h-20 rounded-2xl bg-indigo-50 border-2 border-indigo-500 overflow-hidden flex-shrink-0 flex items-center justify-center">
        <img id="studentProfileImg" src="https://via.placeholder.com/150" alt="Profile Photo" class="w-full h-full object-cover hidden">
        <span id="defaultAvatar" class="text-3xl">👤</span>
      </div>
      <div>
        <h2 id="studentName" class="text-xl font-bold text-slate-800">Loading...</h2>
        <p id="studentCollege" class="text-xs text-slate-500 mt-1">College Name</p>
        <div class="flex flex-wrap gap-2 mt-2">
          <span id="studentDept" class="bg-indigo-50 text-indigo-900 text-[11px] font-bold px-2.5 py-1 rounded-lg border border-indigo-100">
            Department
          </span>
          <span id="studentYear" class="bg-slate-100 text-slate-600 text-[11px] font-semibold px-2.5 py-1 rounded-lg">
            Year
          </span>
        </div>
      </div>
    </div>

    <div class="flex justify-between items-center mb-4 px-1">
      <h3 class="text-lg font-bold text-slate-800">Available Jobs 🏨</h3>
      <span class="text-xs text-slate-500 font-medium">Updated Live</span>
    </div>
    
    <div id="jobsListContainer" class="space-y-4">
      <div class="text-center py-10 bg-white rounded-2xl border border-slate-200 shadow-sm">
        <p class="text-sm text-slate-500 animate-pulse">Loading jobs for you...</p>
      </div>
    </div>

  </main>

  <script type="module" src="./student-dashboard.js"></script>

</body>
</html>
