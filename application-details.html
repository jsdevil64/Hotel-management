<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Application Details - HotelJobs</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen p-2 sm:p-4">
  <div class="w-full max-w-sm bg-white rounded-3xl shadow-xl overflow-hidden flex flex-col justify-between min-h-[680px] relative">
    
    <div>
      <div class="bg-indigo-950 text-white p-4 flex items-center space-x-4">
        <a href="my-applications.html" class="text-lg">&larr;</a>
        <h2 class="font-bold text-sm">Application Details</h2>
      </div>

      <div class="p-4 space-y-4">
        <div class="flex items-center space-x-3 border-b pb-3">
          <div class="w-10 h-10 border rounded-lg flex items-center justify-center font-bold text-amber-600 text-xs bg-amber-50">TAJ</div>
          <div class="flex-1">
            <h3 class="text-xs font-bold text-gray-800">Front Office Associate</h3>
            <p class="text-[10px] text-gray-500">Taj Hotel, Chennai</p>
            <p class="text-[9px] text-gray-400">Applied on 15 May 2025</p>
          </div>
          <span class="bg-blue-100 text-blue-700 text-[10px] font-bold px-2 py-0.5 rounded-full">Applied</span>
        </div>

        <div class="space-y-2">
          <h4 class="text-xs font-bold text-gray-800">Application Status</h4>
          
          <div class="flex items-center justify-between text-[10px] pt-2 relative">
            <div class="absolute top-1/2 left-4 right-4 h-0.5 bg-gray-200 -translate-y-2 z-0"></div>

            <div class="flex flex-col items-center relative z-10">
              <div class="w-5 h-5 bg-indigo-900 text-white rounded-full flex items-center justify-center text-[10px]">✓</div>
              <span class="text-[9px] font-semibold text-indigo-900 mt-1">Applied</span>
            </div>

            <div class="flex flex-col items-center relative z-10">
              <div class="w-2.5 h-2.5 bg-gray-300 rounded-full my-1"></div>
              <span class="text-[9px] text-gray-400 mt-1">Shortlisted</span>
            </div>

            <div class="flex flex-col items-center relative z-10">
              <div class="w-2.5 h-2.5 bg-gray-300 rounded-full my-1"></div>
              <span class="text-[9px] text-gray-400 mt-1">Interview</span>
            </div>

            <div class="flex flex-col items-center relative z-10">
              <div class="w-2.5 h-2.5 bg-gray-300 rounded-full my-1"></div>
              <span class="text-[9px] text-gray-400 mt-1">Offered</span>
            </div>
          </div>
        </div>

        <div class="bg-gray-50 p-3 rounded-2xl border space-y-2 text-xs">
          <h4 class="font-bold text-gray-800 text-[11px]">Job Details</h4>
          
          <div class="flex justify-between">
            <span class="text-gray-500 text-[10px]">Job Type</span>
            <span class="font-medium text-gray-800 text-[10px]">Full Time</span>
          </div>
          <div class="flex justify-between">
            <span class="text-gray-500 text-[10px]">Experience</span>
            <span class="font-medium text-gray-800 text-[10px]">0 - 2 Years</span>
          </div>
          <div class="flex justify-between">
            <span class="text-gray-500 text-[10px]">Location</span>
            <span class="font-medium text-gray-800 text-[10px]">Chennai, Tamil Nadu</span>
          </div>
          <div class="flex justify-between">
            <span class="text-gray-500 text-[10px]">Salary</span>
            <span class="font-medium text-amber-600 text-[10px]">₹15,000 - ₹20,000 /month</span>
          </div>
        </div>
      </div>
    </div>

    <div class="p-4 border-t flex space-x-3 bg-white">
      <a href="job-details.html" class="w-1/2 py-2.5 border border-indigo-900 text-indigo-900 text-xs font-bold rounded-xl text-center">
        View Job
      </a>
      <button class="w-1/2 py-2.5 border border-red-500 text-red-500 hover:bg-red-50 text-xs font-bold rounded-xl">
        Withdraw Application
      </button>
    </div>

  </div>
</body>
</html>
