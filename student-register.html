<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Student Account - HotelJobs</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4 py-8">

  <div class="w-full max-w-md bg-white rounded-3xl p-6 md:p-8 shadow-xl border border-slate-200">
    
    <div class="text-center mb-6">
      <h2 class="text-2xl font-bold text-slate-800">Create Student Account</h2>
      <p class="text-xs text-slate-500 mt-1">Join HotelJobs to find your dream job</p>
    </div>

    <form id="studentRegisterForm" class="space-y-4">
      
      <div class="flex flex-col items-center justify-center mb-4">
        <div class="relative w-24 h-24 rounded-full bg-slate-100 border-2 border-indigo-500 flex items-center justify-center overflow-hidden shadow-md">
          <img id="photoPreview" src="https://via.placeholder.com/150" alt="Profile Preview" class="w-full h-full object-cover hidden">
          <svg id="defaultAvatar" class="w-12 h-12 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
          </svg>
        </div>
        <label for="profilePhoto" class="mt-2 text-xs font-bold text-indigo-900 cursor-pointer hover:underline">
          📷 Upload Profile Photo
        </label>
        <input type="file" id="profilePhoto" accept="image/*" class="hidden">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Full Name</label>
        <input type="text" id="fullName" required placeholder="John Doe" 
          class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Email Address</label>
        <input type="email" id="email" required placeholder="john@example.com" 
          class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Phone Number</label>
        <input type="tel" id="phone" required placeholder="9876543210" 
          class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Password</label>
        <input type="password" id="password" required placeholder="••••••••" 
          class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Confirm Password</label>
        <input type="password" id="confirmPassword" required placeholder="••••••••" 
          class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">College Name</label>
        <input type="text" id="collegeName" required placeholder="e.g., SRM Institute" 
          class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Department</label>
        <select id="department" required class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50 text-slate-700">
          <option value="" disabled selected>Select Department</option>
          <option value="Hotel Management">Hotel Management</option>
          <option value="Catering Science">Catering Science</option>
          <option value="Food & Beverage">Food & Beverage Services</option>
          <option value="Culinary Arts">Culinary Arts</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Year of Study</label>
        <select id="yearOfStudy" required class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50 text-slate-700">
          <option value="" disabled selected>Select Year</option>
          <option value="1st Year">1st Year</option>
          <option value="2nd Year">2nd Year</option>
          <option value="3rd Year">3rd Year</option>
          <option value="4th Year">4th Year</option>
          <option value="Passed Out">Passed Out</option>
        </select>
      </div>

      <button type="submit" id="submitBtn" 
        class="w-full py-3.5 mt-2 bg-indigo-900 hover:bg-indigo-950 text-white font-bold rounded-xl text-sm transition duration-200 shadow-md">
        Create Account
      </button>

    </form>

    <div class="text-center mt-6">
      <p class="text-xs text-slate-500">
        Already have an account? 
        <a href="student-login.html" class="text-indigo-900 font-bold hover:underline">Sign In</a>
      </p>
    </div>

  </div>

  <script type="module" src="./student-register.js"></script>

</body>
      </html>
