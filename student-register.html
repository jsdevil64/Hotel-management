<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Register - HotelJobs</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-4">

  <div class="w-full max-w-md bg-white rounded-3xl p-6 shadow-xl border border-slate-100">
    
    <div class="text-center mb-6">
      <h2 class="text-2xl font-bold text-slate-800">Create Student Account</h2>
      <p class="text-xs text-slate-500 mt-1">Join HotelJobs to find your dream job</p>
    </div>

    <form id="registerForm" class="space-y-4">
      
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Full Name</label>
        <input type="text" id="fullName" required placeholder="John Doe" 
          class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Email Address</label>
        <input type="email" id="email" required placeholder="john@example.com" 
          class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Phone Number</label>
        <input type="tel" id="phone" placeholder="9876543210" 
          class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Password</label>
        <input type="password" id="password" required placeholder="••••••••" 
          class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>

      <button type="submit" id="submitBtn" 
        class="w-full py-3.5 bg-indigo-900 hover:bg-indigo-950 text-white font-bold rounded-xl text-sm transition duration-200 shadow-md">
        Create Account
      </button>

    </form>

    <div class="text-center mt-6">
      <p class="text-xs text-slate-500">
        Already have an account? 
        <a href="student-login.html" class="text-indigo-900 font-bold hover:underline">Sign In</a>
      </p>
    </div>

  </div>

  <script type="module">
    import { auth, db, createUserWithEmailAndPassword, doc, setDoc } from './firebase-config.js';

    console.log("Script Connected!"); // Connection Check

    const form = document.getElementById('registerForm');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      console.log("Form Submitted!"); // Click Check
      
      submitBtn.innerText = "Processing...";
      submitBtn.disabled = true;

      const name = document.getElementById('fullName').value;
      const email = document.getElementById('email').value;
      const phone = document.getElementById('phone').value;
      const password = document.getElementById('password').value;

      try {
        // 1. Firebase Auth Registration
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;

        // 2. Save User in Database
        await setDoc(doc(db, "students", user.uid), {
          uid: user.uid,
          name: name,
          email: email,
          phone: phone,
          role: "student",
          createdAt: new Date()
        });

        alert("கணக்கு வெற்றிகரமாக உருவாக்கப்பட்டது! 🎉");
        window.location.href = "student-dashboard.html";

      } catch (error) {
        alert("பிழை: " + error.message);
        submitBtn.innerText = "Create Account";
        submitBtn.disabled = false;
      }
    });
  </script>

</body>
</html>
