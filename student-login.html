<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login - HotelJobs</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-4">

  <div class="w-full max-w-md bg-white rounded-3xl p-6 shadow-xl border border-slate-100">
    
    <div class="text-center mb-6">
      <h2 class="text-2xl font-bold text-slate-800">Welcome Back 👋</h2>
      <p class="text-xs text-slate-500 mt-1">Sign in to your Student Account</p>
    </div>

    <form id="loginForm" class="space-y-4">
      
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Email Address</label>
        <input type="email" id="email" required placeholder="student@example.com" 
          class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Password</label>
        <input type="password" id="password" required placeholder="••••••••" 
          class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>

      <button type="submit" id="submitBtn" 
        class="w-full py-3.5 bg-indigo-900 hover:bg-indigo-950 text-white font-bold rounded-xl text-sm transition duration-200 shadow-md">
        Sign In
      </button>

    </form>
    <div class="text-center mt-6">
      <p class="text-xs text-slate-500">
        Don't have an account? 
        <a href="student-register.html" class="text-indigo-900 font-bold hover:underline">Create Account</a>
      </p>
    </div>

  </div>

  <script type="module" src="./student-login.js"></script>

</body>
</html>
