<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Login - HotelJobs</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen p-4">
  <div class="w-full max-w-sm bg-white rounded-3xl shadow-xl p-6 space-y-5">
    
    <div class="flex items-center justify-between">
      <a href="Home.html" class="text-gray-600 text-xl">&larr;</a>
      <div class="flex items-center space-x-1">
        <span class="text-amber-500">🏨</span>
        <span class="font-bold text-lg text-purple-900">Hotel<span class="text-amber-500">Jobs</span></span>
      </div>
      <div></div>
    </div>

    <div class="text-center">
      <h2 class="text-xl font-bold text-gray-800">Hotel Login</h2>
      <p class="text-xs text-gray-500">Welcome back! Please login to continue</p>
    </div>

    <form class="space-y-4">
      <div>
        <label class="text-xs font-semibold text-gray-700 block mb-1">Email Address</label>
        <input type="email" placeholder="Enter your email" class="w-full border rounded-xl p-2.5 text-xs focus:ring-2 focus:ring-amber-500 outline-none">
      </div>
      <div>
        <label class="text-xs font-semibold text-gray-700 block mb-1">Password</label>
        <input type="password" placeholder="Enter your password" class="w-full border rounded-xl p-2.5 text-xs focus:ring-2 focus:ring-amber-500 outline-none">
        <div class="text-right mt-1">
          <a href="#" class="text-[10px] text-amber-600 hover:underline">Forgot Password?</a>
        </div>
      </div>

      <button type="submit" class="w-full py-3 bg-amber-500 hover:bg-amber-600 text-white text-xs font-semibold rounded-xl">Login</button>
    </form>

    <div class="text-center">
      <p class="text-[10px] text-gray-400 mb-3">or continue with</p>
      <div class="grid grid-cols-2 gap-3">
        <button class="border py-2 rounded-xl text-xs flex justify-center items-center space-x-2 hover:bg-gray-50">
          <span>Google</span>
        </button>
        <button class="border py-2 rounded-xl text-xs flex justify-center items-center space-x-2 hover:bg-gray-50">
          <span class="text-blue-600">Facebook</span>
        </button>
      </div>
    </div>

    <p class="text-center text-xs text-gray-500">
      Don't have an account? <a href="hotel-register.html" class="text-amber-500 font-semibold hover:underline">Register</a>
    </p>

  </div>
</body>
</html>
