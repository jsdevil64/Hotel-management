<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Profile - HotelJobs</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen p-2 sm:p-4">
  <div class="w-full max-w-sm bg-white rounded-3xl shadow-xl overflow-hidden flex flex-col justify-between min-h-[680px]">
    
    <div>
      <div class="bg-indigo-950 text-white p-4 flex justify-between items-center">
        <a href="student-profile.html" class="text-lg">&larr;</a>
        <h2 class="font-bold text-sm">Edit Profile</h2>
        <button class="text-xs font-semibold text-amber-400">Save</button>
      </div>

      <div class="p-4 space-y-4">
        <div class="flex justify-center">
          <div class="relative">
            <div class="w-20 h-20 bg-amber-200 rounded-full flex items-center justify-center text-2xl font-bold text-indigo-950 border-2 border-indigo-900">
              P
            </div>
            <button class="absolute bottom-0 right-0 bg-indigo-900 text-white p-1.5 rounded-full text-xs shadow-md">📷</button>
          </div>
        </div>

        <form class="space-y-3 text-xs">
          <div>
            <label class="font-semibold text-gray-700 block mb-1">Full Name</label>
            <input type="text" value="Priya S" class="w-full border rounded-xl p-2.5 outline-none focus:ring-1 focus:ring-indigo-600">
          </div>

          <div>
            <label class="font-semibold text-gray-700 block mb-1">Email</label>
            <input type="email" value="priya.s@email.com" class="w-full border rounded-xl p-2.5 outline-none focus:ring-1 focus:ring-indigo-600">
          </div>

          <div>
            <label class="font-semibold text-gray-700 block mb-1">Phone Number</label>
            <input type="tel" value="+91 98765 43210" class="w-full border rounded-xl p-2.5 outline-none focus:ring-1 focus:ring-indigo-600">
          </div>

          <div>
            <label class="font-semibold text-gray-700 block mb-1">Location</label>
            <select class="w-full border rounded-xl p-2.5 outline-none focus:ring-1 focus:ring-indigo-600 bg-white">
              <option selected>Chennai, Tamil Nadu</option>
              <option>Coimbatore, Tamil Nadu</option>
              <option>Madurai, Tamil Nadu</option>
            </select>
          </div>

          <div>
            <label class="font-semibold text-gray-700 block mb-1">Date of Birth</label>
            <input type="text" value="15 / 08 / 2002" class="w-full border rounded-xl p-2.5 outline-none focus:ring-1 focus:ring-indigo-600">
          </div>

          <div>
            <label class="font-semibold text-gray-700 block mb-1">Bio</label>
            <textarea rows="3" class="w-full border rounded-xl p-2.5 outline-none focus:ring-1 focus:ring-indigo-600">Passionate about hospitality and customer service. Looking for exciting opportunities in the hotel industry.</textarea>
          </div>

          <button type="submit" class="w-full py-3 bg-indigo-900 hover:bg-indigo-950 text-white font-bold rounded-xl mt-2">
            Save Changes
          </button>
        </form>
      </div>
    </div>

  </div>
</body>
</html>
