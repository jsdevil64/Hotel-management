<!DOCTYPE html>
<html lang="ta">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Resume - HotelJobs</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen p-2 sm:p-4">
  <div class="w-full max-w-sm bg-gray-50 rounded-3xl shadow-xl overflow-hidden flex flex-col justify-between min-h-[680px] pb-16 relative">
    
    <div>
      <div class="bg-indigo-950 text-white p-4 flex justify-between items-center">
        <a href="student-profile.html" class="text-lg">&larr;</a>
        <h2 class="font-bold text-sm">My Resume</h2>
        <div></div>
      </div>

      <div class="p-4 space-y-4">
        <div class="bg-white p-4 rounded-2xl border shadow-sm flex items-center justify-between">
          <div class="flex items-center space-x-3">
            <div class="w-10 h-10 bg-red-100 text-red-600 rounded-xl flex items-center justify-center font-bold text-xs">
              PDF
            </div>
            <div>
              <h4 class="text-xs font-bold text-gray-800">Priya_S_Resume.pdf</h4>
              <p class="text-[10px] text-gray-400">Uploaded on 10 May 2025</p>
              <p class="text-[9px] text-gray-400">(245 KB)</p>
            </div>
          </div>
          <button class="border border-indigo-600 text-indigo-600 text-[10px] font-bold px-3 py-1 rounded-lg">Preview</button>
        </div>

        <div class="bg-indigo-50 p-4 rounded-2xl border border-indigo-100 space-y-2">
          <h4 class="text-xs font-bold text-indigo-900">Resume Tips</h4>
          <ul class="text-[11px] text-indigo-800 space-y-1">
            <li class="flex items-center space-x-2"><span>✔</span><span>Keep your resume updated</span></li>
            <li class="flex items-center space-x-2"><span>✔</span><span>Highlight relevant skills</span></li>
            <li class="flex items-center space-x-2"><span>✔</span><span>Use clear and professional format</span></li>
            <li class="flex items-center space-x-2"><span>✔</span><span>Maximum file size: 2 MB (PDF only)</span></li>
          </ul>
        </div>

        <div class="space-y-2">
          <h4 class="text-xs font-bold text-gray-800">Other Actions</h4>
          <button class="w-full bg-white p-3 rounded-xl border text-xs flex justify-between items-center hover:bg-gray-50">
            <span class="font-medium text-gray-700">📤 Update Resume</span>
            <span class="text-gray-400">&gt;</span>
          </button>
          <button class="w-full bg-white p-3 rounded-xl border text-xs flex justify-between items-center hover:bg-gray-50">
            <span class="font-medium text-gray-700">📥 Download Resume</span>
            <span class="text-gray-400">&gt;</span>
          </button>
        </div>
      </div>
    </div>

    <div class="absolute bottom-0 left-0 right-0 bg-white border-t flex justify-around py-2 text-[10px] text-gray-500">
      <a href="student-dashboard.html" class="flex flex-col items-center hover:text-indigo-600">

      <a href="find-jobs.html" class="flex flex-col items-center hover:text-indigo-600">

      <a href="my-applications.html" class="flex flex-col items-center hover:text-indigo-600">
        <span>📋</span><span>Applications</span>
      </a>
      <a href="job-alerts.html" class="flex flex-col items-center hover:text-indigo-600">
        <span>🔔</span><span>Alerts</span>
      </a>
      <a href="student-profile.html" class="flex flex-col items-center text-indigo-600 font-bold">
